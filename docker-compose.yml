name: bancada

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bancada}
      POSTGRES_USER: ${POSTGRES_USER:-bancada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bancada}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bancada} -d ${POSTGRES_DB:-bancada}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: desenvolvimento
    env_file: .env
    environment:
      # Cada execução dos testes de navegador cadastra doze assistências, acima do limite de 10
      # por hora da produção (ADR 0037).
      THROTTLE_CADASTRO: ${THROTTLE_CADASTRO:-100/hour}
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./apps/api:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./apps/api
      target: desenvolvimento
    env_file: .env
    command: celery -A config worker --loglevel=info
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./apps/api
      target: desenvolvimento
    env_file: .env
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: desenvolvimento
    environment:
      API_INTERNAL_URL: http://api:8000
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      WHATSAPP_DO_SUPORTE: ${WHATSAPP_DO_SUPORTE:-}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  # A API e o site das capturas de tela da página inicial (make capturar-telas, ADR 0038), sobre um
  # banco à parte, refeito a cada vez com o movimento de exemplo. As tarefas vão para outro banco do
  # Redis: o worker de desenvolvimento procuraria os eventos no banco errado.
  api-capturas:
    profiles: [capturas]
    build:
      context: ./apps/api
      target: desenvolvimento
    env_file: .env
    environment:
      POSTGRES_DB: bancada_capturas
      REDIS_URL: redis://redis:6379/1
      DJANGO_ALLOWED_HOSTS: localhost,api-capturas
    command: >-
      sh -c "python manage.py migrate && python manage.py semear && python manage.py semear_movimento
      && python manage.py preparar_capturas && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./apps/api:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 600s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web-capturas:
    profiles: [capturas]
    build:
      context: ./apps/web
      target: producao
    environment:
      API_INTERNAL_URL: http://api-capturas:8000
      APP_PUBLIC_URL: http://localhost:3001
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/saude').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 6
    depends_on:
      api-capturas:
        condition: service_healthy

volumes:
  postgres_data:

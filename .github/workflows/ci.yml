name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: bancada
          POSTGRES_USER: bancada
          POSTGRES_PASSWORD: bancada
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_DB: bancada
      POSTGRES_USER: bancada
      POSTGRES_PASSWORD: bancada
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_APP_USER: bancada_app
      POSTGRES_APP_PASSWORD: bancada
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: chave-de-teste-da-integracao-continua-com-mais-de-cinquenta-caracteres
      DJANGO_DEBUG: "0"
      BANCADA_ENCRYPTION_KEY: "_yZVy9WCAy0D0a-lmL_rbF6v-Aq1aUQhNa-oR5d2JIo="

    steps:
      - uses: actions/checkout@v7

      - name: Instalar as bibliotecas de sistema do gerador de PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core

      - name: Criar o papel da aplicacao no banco
        env:
          PGPASSWORD: bancada
        run: psql -h localhost -U bancada -d bancada -f ../../infra/postgres/init.sql

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy .

      - name: Tests
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  producao:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: bancada
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_DB: bancada
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: chave-de-teste-da-integracao-continua-com-mais-de-cinquenta-caracteres
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      BANCADA_ENCRYPTION_KEY: "_yZVy9WCAy0D0a-lmL_rbF6v-Aq1aUQhNa-oR5d2JIo="

    steps:
      - uses: actions/checkout@v7

      - name: Montar as imagens de produção
        run: |
          docker build --target producao --build-arg VERSAO=${{ github.sha }} -t bancada-api apps/api
          docker build --target producao --build-arg VERSAO=${{ github.sha }} -t bancada-web apps/web
          docker build -t bancada-backup infra/producao/backup

      - name: Criar os papéis do banco como em produção
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h localhost -U postgres -d bancada
          -v banco=bancada -v dono=bancada_dono -v senha_do_dono=dono
          -v aplicacao=bancada_app -v senha_da_aplicacao=aplicacao
          -f infra/producao/postgres/papeis.sql

      - name: Migrar com o dono das tabelas
        run: >-
          docker run --rm --network host
          -e POSTGRES_DB -e POSTGRES_HOST -e POSTGRES_PORT -e REDIS_URL
          -e DJANGO_SECRET_KEY -e DJANGO_DEBUG -e DJANGO_ALLOWED_HOSTS -e BANCADA_ENCRYPTION_KEY
          -e POSTGRES_APP_USER=bancada_dono -e POSTGRES_APP_PASSWORD=dono
          bancada-api python manage.py migrate --noinput

      - name: Gravar dados de exemplo com o papel da aplicação
        run: >-
          docker run --rm --network host
          -e POSTGRES_DB -e POSTGRES_HOST -e POSTGRES_PORT -e REDIS_URL
          -e DJANGO_SECRET_KEY -e DJANGO_ALLOWED_HOSTS -e BANCADA_ENCRYPTION_KEY
          -e DJANGO_DEBUG=1 -e POSTGRES_APP_USER=bancada_app -e POSTGRES_APP_PASSWORD=aplicacao
          bancada-api python manage.py semear

      # Os testes de navegador cadastram dez assistências por execução, o limite de uma hora. O
      # limite maior deixa espaço para uma nova tentativa de um teste (ADR 0036).
      - name: Subir a API com o papel da aplicação
        run: >-
          docker run -d --name api --network host
          -e POSTGRES_DB -e POSTGRES_HOST -e POSTGRES_PORT -e REDIS_URL
          -e DJANGO_SECRET_KEY -e DJANGO_DEBUG -e DJANGO_ALLOWED_HOSTS -e BANCADA_ENCRYPTION_KEY
          -e POSTGRES_APP_USER=bancada_app -e POSTGRES_APP_PASSWORD=aplicacao
          -e THROTTLE_CADASTRO=30/hour
          bancada-api

      - name: Subir o site
        run: >-
          docker run -d --name web --network host
          -e API_INTERNAL_URL=http://localhost:8000 -e APP_PUBLIC_URL=http://localhost:3000
          bancada-web

      - name: Conferir que o site e a API respondem
        run: |
          for tentativa in $(seq 30); do
            curl -sf http://localhost:3000/saude && break
            sleep 2
          done
          curl -sf http://localhost:3000/saude
          curl -sf -o /dev/null http://localhost:3000/
          curl -sf -o /dev/null http://localhost:3000/demonstracao
          curl -sf -o /dev/null http://localhost:8000/static/admin/css/base.css

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar o Playwright e o navegador
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium

      - name: Testar o site no navegador
        working-directory: apps/web
        env:
          ENDERECO_DO_SITE: http://localhost:3000
        run: npx playwright test

      - name: Guardar o relatório dos testes do navegador
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-do-playwright
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Fazer um backup e restaurá-lo num banco de teste
        run: >-
          docker run --rm --network host
          -e PGHOST=localhost -e PGUSER=postgres -e PGPASSWORD=postgres -e PGDATABASE=bancada
          bancada-backup backup.sh agora

      - name: Mostrar os logs se algo falhou
        if: failure()
        run: |
          docker logs api || true
          docker logs web || true
